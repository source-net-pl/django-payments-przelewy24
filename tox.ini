[tox]
requires = tox>=4.23
env_list =
    py{310,311,312,313,314}-django52
    py{312,313,314}-django{60,61}
    quality
skip_missing_interpreters = false

[testenv]
package = wheel
extras = test
set_env =
    COVERAGE_FILE = {env_tmp_dir}/.coverage
deps =
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
commands =
    python -m django check --settings=tests.settings
    python -m django makemigrations --check --dry-run --settings=tests.settings
    python -m pytest --cov=payments_przelewy24 --cov-report=term-missing

[testenv:quality]
extras = dev
commands =
    ruff check .
    ruff format --check .
    mypy

