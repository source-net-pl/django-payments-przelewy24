name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django: ['5.2', '6.0', '6.1']
        exclude:
          - {python: '3.10', django: '6.0'}
          - {python: '3.10', django: '6.1'}
          - {python: '3.11', django: '6.0'}
          - {python: '3.11', django: '6.1'}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install tox
      - name: Test supported combination
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          DJANGO_VERSION: ${{ matrix.django }}
        run: |
          python_tag="${PYTHON_VERSION//./}"
          django_tag="${DJANGO_VERSION//./}"
          python -m tox -e "py${python_tag}-django${django_tag}"

  postgresql:
    name: PostgreSQL / concurrent callbacks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: p24
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      P24_TEST_POSTGRES: '1'
      PGDATABASE: p24
      PGUSER: postgres
      PGPASSWORD: test-only
      PGHOST: 127.0.0.1
      PGPORT: '5432'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[test]' 'psycopg[binary]>=3.2,<4'
      - run: python -m pytest --cov=payments_przelewy24 --cov-report=term-missing

  quality:
    name: Lint, types and distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test wheel outside the source tree
        run: |
          python -m venv /tmp/p24-wheel
          /tmp/p24-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/p24-wheel/bin/python - <<'PY'
          from importlib.metadata import version
          from importlib.resources import files
          from payments_przelewy24.config import Przelewy24Config
          assert version('django-payments-przelewy24') == '2.0.0'
          assert files('payments_przelewy24').joinpath('py.typed').is_file()
          config = Przelewy24Config(pos_id=1, merchant_id=2, crc='test', api_key='test')
          assert config.sandbox is True
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: distribution
          path: dist/*
