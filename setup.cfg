[wheel]
universal = 1

[flake8]
ignore = D203
exclude =
    payments_przelewy24/migrations,
    .git,
    .tox,
    build,
    dist
max-line-length = 119

[ruff]
line-length = 119
target-version = "py38"

[ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["D203"]
exclude = ["payments_przelewy24/migrations", ".git", ".tox", "build", "dist"]

[mypy]
python_version = 3.8
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[mypy-payments.*]
ignore_missing_imports = true

[zest.releaser]
python-file-with-version = payments_przelewy24/__init__.py
